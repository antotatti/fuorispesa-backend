name: Spider Esselunga Automatico

on:
  schedule:
    # Si avvia in automatico ogni giorno alle 03:00 di notte
    - cron: '0 3 * * *'
  workflow_dispatch: 
    # Questo ti permette di avviarlo a mano dal sito di GitHub cliccando un bottone

permissions:
  contents: write

jobs:
  aggiorna-offerte:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Lancia lo Spider Esselunga
        run: python scraper_esselunga.py

      - name: Salva il nuovo JSON su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add esselunga_offerte.json
          git commit -m "🤖 Dati Esselunga aggiornati in automatico" || echo "Nessuna modifica da salvare"
          git push
